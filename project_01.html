  <!-- Sets data-theme before this page's own <style> block below is parsed,
       so the homepage's saved theme (same 'theme' localStorage key) carries
       over here. No saved value falls back to the OS/browser
       prefers-color-scheme; no preference there either = dark. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>

        .loader { background: #000000; transition: opacity 0.1s ease, visibility 0.1s ease; }

        /* Light-mode overrides for this file's own hand-authored bootstrap CSS
           (loaded before Tailwind/projects-tailwind.css tokens exist as classes
           here) — hero-bg-custom/::before is deliberately excluded, same
           reasoning as the hero text: fixed photo + vignette, not chrome.
           .loader is NOT excluded (below): it's a full-bleed overlay, not a
           photo, and was left black-with-white-text/ring in light mode — a
           correct dark loader flashing in front of an otherwise light page. */
        html[data-theme="light"],
        html[data-theme="light"] body {
            background-color: var(--color-police-dark);
            color: var(--color-text);
        }

        :root[data-theme="light"] .loader {
            background: var(--color-police-dark);
        }
        :root[data-theme="light"] .loader-text {
            color: var(--color-text);
        }
        :root[data-theme="light"] .loader-animation:before,
        :root[data-theme="light"] .loader-animation:after {
            box-shadow: 0 0 0 3px inset var(--color-text);
        }

        :root[data-theme="light"] .panel-title {
            color: var(--color-police-primary);
        }

        :root[data-theme="light"] .glass-panel {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-police-dark-light) 95%, transparent), color-mix(in srgb, var(--color-police-dark) 98%, transparent));
            border-left-color: color-mix(in srgb, var(--color-border) 8%, transparent);
        }

        :root[data-theme="light"] .feature-card:hover {
            border-color: color-mix(in srgb, var(--color-police-primary) 40%, transparent);
            box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--color-police-primary) 20%, transparent);
        }

        :root[data-theme="light"] .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--color-police-primary);
        }
    </style>
