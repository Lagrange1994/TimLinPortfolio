<!DOCTYPE html>
<html lang="zh-TW" class="dark sgds-night-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Sets data-theme before portfolio.css's :root[data-theme="light"] block
       is even parsed, so a returning light-mode visitor never flashes dark
       first. No stored value = dark, the site's original/default look. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <!-- portfolio.css only applies once main.tsx's module graph finishes
       loading and React mounts #root — in dev especially, that's a real
       gap after this HTML paints. Without this, html's own `background:
       var(--bg)` (from portfolio.css) isn't active yet, so the browser's
       default blank canvas shows... except a returning light-mode visitor
       has data-theme="light" set by the script above before that CSS ever
       loads, and --bg in light mode is the w_bg.svg photo backdrop — once
       that stylesheet DOES land a beat later, the image flashes in before
       the Loader component (which paints a flat, matching #EBEFF1 over
       everything) has mounted to cover it. Pin the exact flat color the
       Loader itself will show, for both themes, so there's nothing to
       flash regardless of how long the JS graph takes. */
  <style>
    html { background: #0A0912; }
    html[data-theme="light"] { background: #EBEFF1; }
  </style>
  <title>Tim Lin - Product Designer</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico" />
  <meta name="description" content="Tim Lin 的個人作品集。資深 UI/UX 設計師，專精企業後台系統設計、3D 互動體驗與 AI 工作流整合。" />
  <link rel="canonical" href="https://timlin-design.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tim Lin - Product Designer" />
  <meta property="og:description" content="Tim Lin 的個人作品集。資深 UI/UX 設計師，專精企業後台系統設計、3D 互動體驗與 AI 工作流整合。" />
  <meta property="og:image" content="https://timlin-design.vercel.app/img/figure.png" />
  <meta property="og:url" content="https://timlin-design.vercel.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tim Lin - Product Designer" />
  <meta name="twitter:description" content="Tim Lin 的個人作品集。資深 UI/UX 設計師，專精企業後台系統設計、3D 互動體驗與 AI 工作流整合。" />
  <meta name="twitter:image" content="https://timlin-design.vercel.app/img/figure.png" />

  <!-- Perf: resource hints for third-party origins + LCP hero image -->
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preload" as="image" href="/img/figure.png" type="image/png" fetchpriority="high" />
  <!-- Perf: start Spline scene downloads immediately, in parallel with the
       viewer script / React bundle that would otherwise gate them. Media
       queries mirror HERO_FIGURE_BREAKPOINT (768px, see Loader.tsx) — below
       it both scenes are swapped for static images, so mobile preloads the
       webp background instead (browsers without webp support skip this
       preload by type and just fetch the <picture>'s jpg fallback normally,
       see BeamsBackground.tsx) and never touches the .splinecode files. -->
  <link rel="preload" as="fetch" href="/models/bg_scene.splinecode" crossorigin media="(min-width: 768px)" />
  <link rel="preload" as="fetch" href="/models/hero_figure.splinecode" crossorigin media="(min-width: 768px)" />
  <link rel="preload" as="image" type="image/webp" href="/img/bg.webp" media="(max-width: 767px)" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display:wght@100;400&family=Noto+Sans+TC:wght@100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script defer src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Spline viewer (web component). Pinned version must stay >= the
       .splinecode files' own export version (see /models/*.splinecode) — an
       older viewer silently runtime-migrates a newer file on every load
       (console: "Your .splinecode file is more recent than the library"),
       which is extra parse/convert work stacked right on top of the hero's
       GSAP entrance tween and reads as animation jank on load. -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
