<!DOCTYPE html>
<html lang="zh-TW" class="dark sgds-night-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tim Lin - Product Designer</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico" />
  <meta name="description" content="Tim Lin 的個人作品集。資深 UI/UX 設計師，專精企業後台系統設計、3D 互動體驗與 AI 工作流整合。" />

  <!-- Perf: resource hints for third-party origins + LCP hero image -->
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preload" as="image" href="/img/figure.png" type="image/png" fetchpriority="high" />
  <!-- Perf: start Spline scene downloads immediately, in parallel with the
       viewer script / React bundle that would otherwise gate them. Media
       queries mirror HERO_FIGURE_BREAKPOINT (768px, see Loader.tsx) — below
       it both scenes are swapped for static images, so mobile preloads the
       jpg background instead and never touches the .splinecode files. -->
  <link rel="preload" as="fetch" href="/models/bg_scene.splinecode" crossorigin media="(min-width: 768px)" />
  <link rel="preload" as="fetch" href="/models/hero_figure.splinecode" crossorigin media="(min-width: 768px)" />
  <link rel="preload" as="image" href="/img/bg.jpg" media="(max-width: 767px)" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Noto+Sans+TC:wght@100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script defer src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Spline viewer (web component) -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.96/build/spline-viewer.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
