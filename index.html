  <!-- Sets data-theme before portfolio.css's :root[data-theme="light"] block
       is even parsed, so a returning visitor's saved theme applies with no
       flash. No saved value falls back to the OS/browser prefers-color-scheme;
       no preference there either = dark, the site's original/default look. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <!-- portfolio.css only applies once main.tsx's module graph finishes
       loading and React mounts #root — in dev especially, that's a real
       gap after this HTML paints. Without this, html's own `background:
       var(--bg)` (from portfolio.css) isn't active yet, so the browser's
       default blank canvas shows... except a returning light-mode visitor
       has data-theme="light" set by the script above before that CSS ever
       loads, and --bg in light mode is the w_bg.svg photo backdrop — once
       that stylesheet DOES land a beat later, the image flashes in before
       the Loader component (which paints a flat, matching #EBEFF1 over
       everything) has mounted to cover it. Pin the exact flat color the
       Loader itself will show, for both themes, so there's nothing to
       flash regardless of how long the JS graph takes. -->
  <style>
    html { background: #0A0912; }
    html[data-theme="light"] { background: #EBEFF1; }
