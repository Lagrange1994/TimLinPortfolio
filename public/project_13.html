<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super High Tech | CNC 3D Simulator</title>

    <link href="/img/favicon/favicon.ico" rel="shortcut icon" type="image/ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'tech-primary': '#1890FF',
                        'tech-dark': '#0B0C10',
                        'tech-panel': '#1F2833',
                        'tech-accent': '#66FCF1',
                        'tech-grey': '#C5C6C7'
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        display: ['"Orbitron"', 'sans-serif'],
                        body: ['"Inter"', 'sans-serif']
                    },
                    backgroundImage: {
                        'hex-pattern': "url(\"data:image/svg+xml,%3Csvg width='24' height='40' viewBox='0 0 24 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 40c5.523 0 10-4.477 10-10V10C10 4.477 5.523 0 0 0h24c-5.523 0-10 4.477-10 10v20c0 5.523 5.523 10 10 10H0z' fill='%231890FF' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E\")"
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            background-color: #0B0C10;
            color: #C5C6C7;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* 更新：.chamfer-btn 只負責形狀裁切 
           邊框效果由 React Component 中的 Parent(Padding) + Child 結構實現
        */
        .chamfer-btn {
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s ease;
        }

        .chamfer-card {
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        }

        .glass-panel {
            background: rgba(31, 40, 51, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #66FCF1;
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }

        /* === SCANLINE ANIMATION === */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(24, 144, 255, 0.3);
            box-shadow: 0 0 15px rgba(24, 144, 255, 0.6);
            position: absolute;
            z-index: 10;
            animation: scan 4s linear infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -5%;
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                top: 105%;
                opacity: 0;
            }
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #0B0C10;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .loader-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }

        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }

        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }

        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 300ms, transform 300ms;
        }

        /* === GLITCH EFFECT CSS === */
        .glitch-container {
            --gap-horizontal: 10px;
            --gap-vertical: 5px;
            --time-anim: 6s;
            --blend-mode-1: none;
            --blend-mode-2: none;
            --blend-mode-3: overlay;
            --blend-mode-4: none;
            --blend-mode-5: overlay;
            --blend-color-1: transparent;
            --blend-color-2: transparent;
            --blend-color-3: transparent;
            --blend-color-4: #1890FF;
            --blend-color-5: #1890FF;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .glitch__img {
            position: absolute;
            top: calc(-1 * var(--gap-vertical));
            left: calc(-1 * var(--gap-horizontal));
            width: calc(100% + var(--gap-horizontal) * 2);
            height: calc(100% + var(--gap-vertical) * 2);
            background-color: var(--blend-color-1);
            background-size: cover;
            background-position: center;
            transform: translate3d(0, 0, 0);
            background-blend-mode: var(--blend-mode-1);
        }

        .glitch__img:nth-child(n+2) {
            opacity: 0;
        }

        .group:hover .glitch__img:nth-child(n+2) {
            opacity: 1;
            animation-duration: var(--time-anim);
            animation-delay: 0s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .group:hover .glitch__img:nth-child(2) {
            background-color: var(--blend-color-2);
            background-blend-mode: var(--blend-mode-2);
            animation-name: glitch-anim-1;
        }

        .group:hover .glitch__img:nth-child(3) {
            background-color: var(--blend-color-3);
            background-blend-mode: var(--blend-mode-3);
            animation-name: glitch-anim-2;
        }

        .group:hover .glitch__img:nth-child(4) {
            background-color: var(--blend-color-4);
            background-blend-mode: var(--blend-mode-4);
            animation-name: glitch-anim-3;
        }

        .group:hover .glitch__img:nth-child(5) {
            background-color: var(--blend-color-5);
            background-blend-mode: var(--blend-mode-5);
            animation-name: glitch-anim-flash;
        }

        @keyframes glitch-anim-1 {
            0% {
                opacity: 1;
                transform: translate3d(var(--gap-horizontal), 0, 0);
                -webkit-clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%);
                clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%);
            }

            2% {
                -webkit-clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%);
                clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%);
            }

            4% {
                -webkit-clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%);
                clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%);
            }

            6% {
                -webkit-clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%);
                clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%);
            }

            8% {
                -webkit-clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%);
                clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%);
            }

            10% {
                -webkit-clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%);
                clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%);
            }

            12% {
                -webkit-clip-path: polygon(0 50%, 100% 50%, 100% 20%, 0 20%);
                clip-path: polygon(0 50%, 100% 50%, 100% 20%, 0 20%);
            }

            14% {
                -webkit-clip-path: polygon(0 70%, 100% 70%, 100% 70%, 0 70%);
                clip-path: polygon(0 70%, 100% 70%, 100% 70%, 0 70%);
            }

            16% {
                -webkit-clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%);
                clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%);
            }

            18% {
                -webkit-clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%);
                clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%);
            }

            20% {
                -webkit-clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%);
                clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%);
            }

            21.9% {
                opacity: 1;
                transform: translate3d(var(--gap-horizontal), 0, 0);
            }

            22%,
            100% {
                opacity: 0;
                transform: translate3d(0, 0, 0);
                clip-path: polygon(0 0, 0 0, 0 0, 0 0);
            }
        }

        @keyframes glitch-anim-2 {
            0% {
                opacity: 1;
                transform: translate3d(calc(-1 * var(--gap-horizontal)), 0, 0);
                clip-path: polygon(0 25%, 100% 25%, 100% 30%, 0 30%);
            }

            3% {
                clip-path: polygon(0 3%, 100% 3%, 100% 3%, 0 3%);
            }

            5% {
                clip-path: polygon(0 5%, 100% 5%, 100% 20%, 0 20%);
            }

            7% {
                clip-path: polygon(0 20%, 100% 20%, 100% 20%, 0 20%);
            }

            9% {
                clip-path: polygon(0 40%, 100% 40%, 100% 40%, 0 40%);
            }

            11% {
                clip-path: polygon(0 52%, 100% 52%, 100% 59%, 0 59%);
            }

            13% {
                clip-path: polygon(0 60%, 100% 60%, 100% 60%, 0 60%);
            }

            15% {
                clip-path: polygon(0 75%, 100% 75%, 100% 75%, 0 75%);
            }

            17% {
                clip-path: polygon(0 65%, 100% 65%, 100% 40%, 0 40%);
            }

            19% {
                clip-path: polygon(0 45%, 100% 45%, 100% 50%, 0 50%);
            }

            20% {
                clip-path: polygon(0 14%, 100% 14%, 100% 33%, 0 33%);
            }

            21.9% {
                opacity: 1;
                transform: translate3d(calc(-1 * var(--gap-horizontal)), 0, 0);
            }

            22%,
            100% {
                opacity: 0;
                transform: translate3d(0, 0, 0);
                clip-path: polygon(0 0, 0 0, 0 0, 0 0);
            }
        }

        @keyframes glitch-anim-3 {
            0% {
                opacity: 1;
                transform: translate3d(0, calc(-1 * var(--gap-vertical)), 0) scale3d(-1, -1, 1);
                clip-path: polygon(0 1%, 100% 1%, 100% 3%, 0 3%);
            }

            1.5% {
                clip-path: polygon(0 10%, 100% 10%, 100% 9%, 0 9%);
            }

            2% {
                clip-path: polygon(0 5%, 100% 5%, 100% 6%, 0 6%);
            }

            2.5% {
                clip-path: polygon(0 20%, 100% 20%, 100% 20%, 0 20%);
            }

            3% {
                clip-path: polygon(0 10%, 100% 10%, 100% 10%, 0 10%);
            }

            5% {
                clip-path: polygon(0 30%, 100% 30%, 100% 25%, 0 25%);
            }

            5.5% {
                clip-path: polygon(0 15%, 100% 15%, 100% 16%, 0 16%);
            }

            7% {
                clip-path: polygon(0 40%, 100% 40%, 100% 39%, 0 39%);
            }

            8% {
                clip-path: polygon(0 20%, 100% 20%, 100% 21%, 0 21%);
            }

            9% {
                clip-path: polygon(0 60%, 100% 60%, 100% 55%, 0 55%);
            }

            10.5% {
                clip-path: polygon(0 30%, 100% 30%, 100% 31%, 0 31%);
            }

            11% {
                clip-path: polygon(0 70%, 100% 70%, 100% 69%, 0 69%);
            }

            13% {
                clip-path: polygon(0 40%, 100% 40%, 100% 41%, 0 41%);
            }

            14% {
                clip-path: polygon(0 80%, 100% 80%, 100% 75%, 0 75%);
            }

            14.5% {
                clip-path: polygon(0 50%, 100% 50%, 100% 51%, 0 51%);
            }

            15% {
                clip-path: polygon(0 90%, 100% 90%, 100% 90%, 0 90%);
            }

            16% {
                clip-path: polygon(0 60%, 100% 60%, 100% 60%, 0 60%);
            }

            18% {
                clip-path: polygon(0 100%, 100% 100%, 100% 99%, 0 99%);
            }

            20% {
                clip-path: polygon(0 70%, 100% 70%, 100% 71%, 0 71%);
            }

            21.9% {
                opacity: 1;
                transform: translate3d(0, calc(-1 * var(--gap-vertical)), 0) scale3d(-1, -1, 1);
            }

            22%,
            100% {
                opacity: 0;
                transform: translate3d(0, 0, 0);
                clip-path: polygon(0 0, 0 0, 0 0, 0 0);
            }
        }

        @keyframes glitch-anim-flash {

            0%,
            5% {
                opacity: 0.2;
                transform: translate3d(var(--gap-horizontal), var(--gap-vertical), 0);
            }

            5.5%,
            100% {
                opacity: 0;
                transform: translate3d(0, 0, 0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SIMULATOR_URL = "https://cnc-simulator-sable.vercel.app/";

        const CONTENT = {
            zh: {
                hero_title: "SUPER HIGH TECH",
                hero_sub: "CNC 3D SIMULATOR v4.2",
                hero_desc: "Tech Coordinate — 定義未來的精密加工體驗。結合六邊形結構美學與數位孿生技術，打造工程師最可靠的虛擬指揮中心。",
                btn_launch: "INITIALIZE SIMULATION",
                btn_launch_sub: "啟動即時模擬系統",
                section_features: "核心模組 SYSTEM MODULES",
                section_process: "設計流程 DESIGN PROCESS",
                back_home: "Back to Portfolio",
                features: [
                    { title: "Titanium Vault", desc: "全螢幕檔案管理中樞，沉浸式專案切換。", img_3d: "titanium_vault", img_bg: "screen_vault" },
                    { title: "Smart G-Code", desc: "語法高亮與斷點除錯，將編碼轉化為直觀互動。", img_3d: "smart_code", img_bg: "screen_code" },
                    { title: "Digital Twin", desc: "六邊形網格舞台，即時切削預覽 (Ghosting)。", img_3d: "digital_twin", img_bg: "screen_twin", isLarge: true },
                    { title: "Live DRO", desc: "駕駛艙級儀表板，監控主軸轉速與負載。", img_3d: "live_dro", img_bg: "screen_dro" },
                    { title: "Fluid Layout", desc: "三欄式黃金動線設計，符合工程師操作視線流動。", img_3d: "fluid_layout", img_bg: "screen_layout" },
                    { title: "BIOS Config", desc: "全螢幕硬體設定，直觀調整機台物理極限。", img_3d: "bios_config", img_bg: "screen_bios" },
                    { title: "Titanium Dark", desc: "專為工廠低光源環境設計，降低長期操作視覺疲勞。", img_3d: "dark_mode", img_bg: "screen_dark" }
                ]
            }
        };

        const t = CONTENT.zh;

        const Navbar = () => (
            <nav className="fixed top-0 left-0 w-full z-40 px-6 py-4 flex justify-between items-center bg-tech-dark/80 backdrop-blur-md border-b border-white/5">
                <a href="javascript:history.length>1?history.back():void(location.href='/')" className="flex items-center group">
                    {/* Double Layer Button for Border Visibility */}
                    <div className="w-8 h-8 chamfer-btn p-[1px] bg-tech-primary mr-3 group-hover:bg-white transition-colors">
                        <div className="w-full h-full chamfer-btn bg-tech-dark flex items-center justify-center group-hover:bg-tech-primary transition-colors">
                            <i className="ph ph-arrow-left text-tech-primary group-hover:text-white text-xs"></i>
                        </div>
                    </div>
                    <span className="font-mono text-xs text-tech-grey tracking-widest group-hover:text-white transition-colors">{t.back_home}</span>
                </a>
                <div className="flex items-center space-x-2">
                    <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span className="font-mono text-[10px] text-tech-primary tracking-widest">SYSTEM ONLINE</span>
                </div>
            </nav>
        );

        const SimulatorModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 bg-black flex flex-col animate-fadeIn">
                    <div className="h-10 bg-tech-panel border-b border-white/10 flex justify-between items-center px-4 shrink-0">
                        <div className="flex items-center space-x-4">
                            <span className="font-display text-tech-primary font-bold tracking-widest text-sm">SIMULATOR_LIVE</span>
                            <span className="font-mono text-[10px] text-gray-500">1920x1080 NATIVE RES</span>
                        </div>
                        <button onClick={onClose} className="bg-red-500/20 hover:bg-red-500 border border-red-500/50 text-red-500 hover:text-white px-4 py-1 text-xs font-mono font-bold tracking-widest chamfer-btn transition-all flex items-center">
                            <i className="ph ph-power mr-2"></i> DISCONNECT
                        </button>
                    </div>
                    <div className="flex-1 relative w-full h-full bg-black overflow-hidden">
                        <iframe src={SIMULATOR_URL} className="w-full h-full border-0" allowFullScreen title="CNC Simulator"></iframe>
                    </div>
                </div>
            );
        };

        const Hero = ({ onLaunch }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                gsap.fromTo(containerRef.current.children,
                    { y: 50, opacity: 0 },
                    { y: 0, opacity: 1, stagger: 0.2, duration: 1, ease: "power3.out" }
                );
            }, []);

            return (
                <header
                    className="relative min-h-screen flex items-center justify-center bg-fixed bg-cover bg-center overflow-hidden"
                    style={{ backgroundImage: "url('./img/project_13/CNC.webp')" }}
                >
                    <div className="scanline"></div>
                    <div className="absolute inset-0 bg-gradient-to-b from-tech-dark/80 via-tech-dark/70 to-tech-dark z-0 pointer-events-none"></div>
                    <div className="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none z-0">
                        <div className="w-[800px] h-[800px] border border-tech-primary/30 rounded-full animate-spin-slow" style={{ animationDuration: '60s' }}></div>
                        <div className="absolute w-[600px] h-[600px] border border-white/10 rounded-full animate-spin-slow" style={{ animationDuration: '40s', animationDirection: 'reverse' }}></div>
                    </div>

                    <div ref={containerRef} className="relative z-10 text-center px-4 max-w-4xl mx-auto flex flex-col items-center">
                        <div className="inline-block px-4 py-1 mb-6 border border-tech-primary/50 bg-tech-primary/10 text-tech-primary text-xs font-mono tracking-[0.2em] chamfer-btn backdrop-blur-sm">
                            {t.hero_sub}
                        </div>
                        <h1 className="text-5xl md:text-7xl lg:text-8xl font-display font-black text-white mb-8 tracking-tighter leading-tight drop-shadow-2xl">{t.hero_title}</h1>
                        <p className="text-tech-grey text-lg md:text-xl font-light mb-12 max-w-2xl leading-relaxed drop-shadow-md">{t.hero_desc}</p>

                        {/* Double Layer Launch Button */}
                        <button onClick={onLaunch} className="group relative inline-block p-[2px] bg-tech-primary chamfer-btn hover:scale-105 transition-transform duration-300 shadow-[0_0_40px_rgba(24,144,255,0.3)]">
                            <div className="w-full h-full chamfer-btn bg-tech-primary group-hover:bg-white px-12 py-6 flex flex-col items-center justify-center transition-colors">
                                <span className="font-display font-bold text-xl tracking-widest mb-1 flex items-center text-white group-hover:text-tech-dark transition-colors">
                                    <i className="ph ph-play-circle mr-3"></i>{t.btn_launch}
                                </span>
                                <span className="font-mono text-xs opacity-70 tracking-widest text-white group-hover:text-tech-dark transition-colors">{t.btn_launch_sub}</span>
                            </div>
                        </button>

                        <div className="mt-16 flex space-x-8 text-xs font-mono text-gray-400 tracking-widest drop-shadow-sm">
                            <span>REACT.JS</span><span>•</span><span>WEBGL</span><span>•</span><span>THREE.JS</span>
                        </div>
                    </div>
                </header>
            );
        };

        // 4. Feature Grid Section (Double Layer Border for Cards & Icons)
        const Features = () => {
            const scrollRef = useRef(null);
            const labelRef = useRef(null);

            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                const cards = scrollRef.current.children;

                gsap.fromTo(cards,
                    { y: 50, opacity: 0 },
                    {
                        y: 0, opacity: 1, stagger: 0.1, duration: 0.8,
                        scrollTrigger: {
                            trigger: scrollRef.current,
                            start: "top 80%"
                        }
                    }
                );

                gsap.fromTo(labelRef.current,
                    { color: "#4B5563" },
                    {
                        color: "#1890FF",
                        duration: 0.5,
                        scrollTrigger: {
                            trigger: scrollRef.current,
                            start: "top 80%",
                            toggleActions: "play none none reverse"
                        }
                    }
                );
            }, []);

            return (
                <section className="py-24 px-6 bg-tech-dark relative border-t border-white/5">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-16 flex items-end justify-between border-b border-white/10 pb-4">
                            <h2 className="text-3xl font-display font-bold text-white flex items-center">
                                <span className="w-2 h-8 bg-tech-primary mr-4 block"></span>
                                {t.section_features}
                            </h2>
                            <span ref={labelRef} className="font-mono text-gray-600 text-xs hidden md:block tracking-widest transition-colors duration-300">
                                01 // CORE_MODULES
                            </span>
                        </div>

                        <div ref={scrollRef} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 grid-flow-dense">
                            {t.features.map((item, idx) => (
                                /* === 修正重點：卡片外框容器 (Border Layer) === 
                                   1. 移除原本的 border border-white/10
                                   2. 改用 p-[1px] + 背景色 來模擬邊框
                                   3. chamfer-card class 確保外層也有切角
                                */
                                <div
                                    key={idx}
                                    className={`group relative chamfer-card p-[1px] bg-white/10 hover:bg-tech-primary/50 transition-colors duration-500 aspect-[3/2]
                                    ${item.isLarge ? 'md:col-span-2 md:row-span-2' : 'col-span-1'}`}
                                >
                                    {/* === 內容容器 (Content Layer) === 
                                       1. 繼承 chamfer-card 切角
                                       2. w-full h-full 填滿，只留 1px 邊框
                                       3. flex column 佈局
                                    */}
                                    <div className="chamfer-card w-full h-full bg-tech-panel flex flex-col justify-end items-start p-6 relative overflow-hidden">

                                        {/* Background Image Layer */}
                                        <div className="absolute inset-0 z-0 opacity-80 group-hover:opacity-100 transition-opacity duration-500">
                                            <div className="glitch-container">
                                                {[...Array(5)].map((_, i) => (
                                                    <div
                                                        key={i}
                                                        className="glitch__img"
                                                        style={{
                                                            backgroundImage: `url(./img/project_13/${item.img_bg}.jpg)`
                                                        }}
                                                    ></div>
                                                ))}
                                            </div>
                                            <div className="absolute inset-0 bg-gradient-to-t from-tech-dark/95 via-tech-dark/50 to-transparent z-10 pointer-events-none"></div>
                                            <div className="absolute inset-0 bg-tech-primary/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500 mix-blend-overlay z-10 pointer-events-none"></div>
                                        </div>

                                        {/* Content Container */}
                                        <div className="relative z-10 flex flex-row items-center w-full">

                                            {/* Icon Wrapper (Double Layer Border) */}
                                            <div className="flex-shrink-0 mr-6">
                                                <div
                                                    className="relative flex items-center justify-center bg-gradient-to-br from-tech-primary to-tech-dark p-[2px] shadow-[0_0_30px_rgba(24,144,255,0.3)] group-hover:shadow-[0_0_50px_rgba(24,144,255,0.6)] transition-shadow duration-500"
                                                    style={{
                                                        width: item.isLarge ? '100px' : '80px',
                                                        height: item.isLarge ? '100px' : '80px',
                                                        clipPath: 'polygon(20% 0%, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%)'
                                                    }}
                                                >
                                                    <div
                                                        className="w-full h-full bg-tech-dark/80 backdrop-blur-md flex items-center justify-center overflow-hidden relative"
                                                        style={{
                                                            clipPath: 'polygon(20% 0%, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%)'
                                                        }}
                                                    >
                                                        <img
                                                            src={`./img/project_13/${item.img_3d}.png`}
                                                            alt={item.title}
                                                            className="relative z-10 w-full h-full object-cover transform scale-110 group-hover:scale-110 transition-transform duration-700"
                                                            onError={(e) => e.target.style.display = 'none'}
                                                        />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-tech-dark/40 to-transparent z-20 pointer-events-none"></div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Text */}
                                            <div className="flex-1">
                                                <h3 className={`font-display font-bold text-white tracking-wide group-hover:text-tech-accent transition-colors mb-2 ${item.isLarge ? 'text-2xl' : 'text-lg'}`}>
                                                    {item.title}
                                                </h3>
                                                <p className={`text-gray-300 leading-relaxed font-light group-hover:text-gray-100 transition-colors duration-300 shadow-black drop-shadow-md ${item.isLarge ? 'text-sm' : 'text-xs'}`}>
                                                    {item.desc}
                                                </p>
                                            </div>
                                        </div>

                                        {/* Decorative Element */}
                                        <div className="absolute bottom-0 right-0 p-2 opacity-30 group-hover:opacity-100 transition-opacity">
                                            <div className="w-2 h-2 bg-tech-primary"></div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };
        const Showcase = () => {
            const containerRef = useRef(null);
            const labelRef = useRef(null);
            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                gsap.fromTo(containerRef.current, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 1, scrollTrigger: { trigger: containerRef.current, start: "top 70%" } });
                gsap.fromTo(labelRef.current, { color: "#6B7280" }, { color: "#1890FF", duration: 0.5, scrollTrigger: { trigger: containerRef.current, start: "top 80%", toggleActions: "play none none reverse" } });
            }, []);

            return (
                <section className="py-24 px-6 bg-[#0F1014] relative overflow-hidden">
                    <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'linear-gradient(#1f2833 1px, transparent 1px), linear-gradient(90deg, #1f2833 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>
                    <div className="max-w-7xl mx-auto relative z-10" ref={containerRef}>
                        <div className="mb-16 flex items-end justify-between border-b border-white/10 pb-4">
                            <h2 className="text-3xl font-display font-bold text-white flex items-center"><span className="w-2 h-8 bg-red-500 mr-4 block"></span>設計系統 DESIGN SYSTEM</h2>
                            <span ref={labelRef} className="font-mono text-gray-500 text-xs hidden md:block tracking-widest transition-colors duration-300">02 // UI_COMPONENTS</span>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                            <div className="space-y-8">
                                <div className="space-y-4">
                                    <h4 className="font-mono text-sm text-gray-500 tracking-widest">01. INDUSTRIAL PALETTE</h4>
                                    <div className="flex space-x-6">
                                        <div className="space-y-2 group cursor-pointer"><div className="w-16 h-16 bg-[#1890FF] chamfer-btn shadow-[0_0_20px_rgba(24,144,255,0.2)] group-hover:scale-110 transition-transform border border-white/5"></div><div className="text-[10px] font-mono text-[#1890FF]">PRIMARY</div><div className="text-[10px] font-mono text-gray-600">#1890FF</div></div>
                                        {/* Double Layer Dark Swatch */}
                                        <div className="space-y-2 group cursor-pointer">
                                            <div className="w-16 h-16 bg-white/20 p-[1px] chamfer-btn group-hover:scale-110 transition-transform">
                                                <div className="w-full h-full bg-[#141414] chamfer-btn"></div>
                                            </div>
                                            <div className="text-[10px] font-mono text-gray-400">SURFACE</div><div className="text-[10px] font-mono text-gray-600">#141414</div>
                                        </div>
                                        <div className="space-y-2 group cursor-pointer"><div className="w-16 h-16 bg-[#FF4D4F] chamfer-btn shadow-[0_0_20px_rgba(255,77,79,0.2)] group-hover:scale-110 transition-transform border border-white/5"></div><div className="text-[10px] font-mono text-[#FF4D4F]">ALERT</div><div className="text-[10px] font-mono text-gray-600">#FF4D4F</div></div>
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <h4 className="font-mono text-sm text-gray-500 tracking-widest">02. TYPOGRAPHY</h4>
                                    <div className="p-6 border border-white/10 bg-[#141414] chamfer-card space-y-4 shadow-lg">
                                        <div><span className="text-xs text-gray-600 font-mono block mb-1">Display / Orbitron</span><span className="text-3xl font-display font-bold text-white tracking-wide">CNC SIMULATOR</span></div>
                                        <div className="flex items-center space-x-4"><div className="h-8 w-1 bg-green-500"></div><div><span className="text-xs text-gray-600 font-mono block mb-1">Monospace / JetBrains Mono</span><span className="text-sm font-mono text-gray-300"><span className="text-yellow-500">N01</span> <span className="text-[#1890FF]">G01</span> X20.5 F1200;</span></div></div>
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <h4 className="font-mono text-sm text-gray-500 tracking-widest">03. COMPONENT: CHAMFER_BTN</h4>
                                    <div className="flex space-x-4">
                                        {/* Cycle Start: Double Layer */}
                                        <button className="relative group chamfer-btn p-[2px] bg-[#1890FF] shadow-lg">
                                            <div className="w-full h-full chamfer-btn bg-[#1890FF] hover:bg-white px-6 py-3 transition-colors">
                                                <span className="font-mono text-xs font-bold tracking-wider text-white group-hover:text-[#1890FF] transition-colors">CYCLE START</span>
                                            </div>
                                        </button>
                                        {/* Stop: Double Layer (Ghost) */}
                                        <button className="relative group chamfer-btn p-[2px] bg-gray-600 hover:bg-red-500 transition-colors">
                                            <div className="w-full h-full chamfer-btn bg-black px-6 py-3">
                                                <span className="font-mono text-xs font-bold tracking-wider text-gray-400 group-hover:text-red-500 transition-colors">STOP</span>
                                            </div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="relative group perspective-1000">
                                <div className="absolute inset-0 bg-[#1890FF]/10 blur-[80px] rounded-full opacity-20 group-hover:opacity-30 transition-opacity"></div>
                                <div className="relative z-10 transform group-hover:rotate-y-2 group-hover:rotate-x-2 transition-transform duration-700 ease-out">
                                    <img src="/img/project_13/display.webp" alt="UI Mockup" className="w-full border border-white/10 shadow-2xl rounded-lg bg-[#141414]" style={{ clipPath: 'polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px)' }} />
                                    <div className="absolute -bottom-6 -right-6 bg-[#1F2833]/90 border border-[#1890FF]/30 p-4 shadow-xl backdrop-blur-md">
                                        <div className="flex items-center space-x-2 mb-1"><div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div><span className="font-mono text-xs text-gray-400">LIVE_PREVIEW</span></div>
                                        <div className="font-display font-bold text-white text-lg tracking-wider">MAIN DASHBOARD</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 bg-black border-t border-white/10 text-center">
                <p className="text-tech-grey text-xs font-mono tracking-widest mb-4">DESIGNED BY TIM LIN</p>
                <div className="text-[10px] text-gray-700 font-mono">SUPER HIGH TECH © 2025 <br /> ALL SYSTEMS OPERATIONAL</div>
            </footer>
        );

        const App = () => {
            const [isLoading, setIsLoading] = useState(true);
            const [isSimOpen, setIsSimOpen] = useState(false);
            useEffect(() => { setTimeout(() => setIsLoading(false), 1500); }, []);
            return (
                <React.Fragment>
                    <div className={`loader-overlay ${!isLoading ? 'loader-hidden' : ''}`}>
                        <div className="flex flex-col items-center"><div className="w-16 h-16 border-4 border-tech-primary border-t-transparent rounded-full animate-spin mb-4"></div><div className="font-mono text-tech-primary text-xs tracking-[0.3em] animate-pulse">INITIALIZING...</div></div>
                    </div>
                    <Navbar />
                    <main><Hero onLaunch={() => setIsSimOpen(true)} /><Features /><Showcase /></main>
                    <Footer />
                    <SimulatorModal isOpen={isSimOpen} onClose={() => setIsSimOpen(false)} />
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
