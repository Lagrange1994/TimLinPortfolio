  <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0F172A;
            font-family: 'Quicksand', 'GenSen Rounded TW', 'Noto Sans TC', sans-serif;
            color: #fff;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 168, 232, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 168, 232, 0.2);
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #00A8E8;
        }

        .hero-bg-custom {
            background-image: url('./img/project_03/hero_img.jpg');
            background-image: -webkit-image-set(url('./img/project_03/hero_img.webp') 1x, url('./img/project_03/hero_img.jpg') 1x);
            background-image: image-set(url('./img/project_03/hero_img.webp') 1x, url('./img/project_03/hero_img.jpg') 1x);
            background-size: cover;
            background-position: top center;
            position: relative;
        }

        .hero-bg-custom::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
            z-index: 1;
        }

        .loader { background: #0F172A; transition: opacity 0.1s ease, visibility 0.1s ease; }
    </style>
