        /* Light-mode overrides for this file's own hand-authored bootstrap CSS.

            background-color: var(--color-tym-dark);
            color: var(--color-text);
        }

        :root[data-theme="light"] .panel-title {
            color: var(--color-tym-primary);
        }

        :root[data-theme="light"] .glass-panel {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-tym-dark-light) 95%, transparent), color-mix(in srgb, var(--color-tym-dark) 98%, transparent));

        }

        :root[data-theme="light"] .feature-card-standard,
        :root[data-theme="light"] .feature-card-minimal {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-border) 5%, transparent), color-mix(in srgb, var(--color-border) 1%, transparent));
        }

        :root[data-theme="light"] .feature-card-standard:hover {
