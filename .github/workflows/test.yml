name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major as local development. npm versions disagree on which
          # @emnapi/* wasm helpers belong in the lockfile (10.8, 11.6 and 11.19
          # each rejected the others' as "out of sync", failing `npm ci`), so
          # package.json pins @emnapi/core and @emnapi/runtime as devDependencies:
          # that keeps the lockfile installable whichever npm wrote it.
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
