  <!-- Sets data-theme before this page's own <style> block below is parsed,
       so the homepage's saved theme (same 'theme' localStorage key) carries
       over here. No saved value falls back to the OS/browser
       prefers-color-scheme; no preference there either = dark. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>

        .feature-card:hover {

        }

            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #ff4a00;
        }

        .comparison-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .comparison-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .comparison-slider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ff4a00;
            cursor: ew-resize;
            z-index: 20;
        }

        .comparison-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            background: #ff4a00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .hero-bg-custom {
            background-color: #080201;
            background-image: url('./img/project_02/hero_img.jpg');
            background-image: -webkit-image-set(url('./img/project_02/hero_img.webp') 1x, url('./img/project_02/hero_img.jpg') 1x);
            background-image: image-set(url('./img/project_02/hero_img.webp') 1x, url('./img/project_02/hero_img.jpg') 1x);
            background-size: cover;
            background-position: center;
        }

        .hero-bg-custom::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(8, 2, 1, 0.2) 0%, rgba(8, 2, 1, 0.5) 100%);
            z-index: 1;
        }

        .loader { background: #0F1115; transition: opacity 0.1s ease, visibility 0.1s ease; }

        /* Light-mode overrides for this file's own hand-authored bootstrap CSS.
           hero-bg-custom/::before deliberately excluded — fixed photo +
           vignette, same reasoning as the always-white hero text. .loader is
           NOT excluded (below): it's a full-bleed overlay, not a photo, and
           was left black-with-white-text/ring in light mode. */
        html[data-theme="light"],
        html[data-theme="light"] body {
            background-color: var(--color-app-dark);
            color: var(--color-text);
        }

        :root[data-theme="light"] .loader {
            background: var(--color-app-dark);
        }
        :root[data-theme="light"] .loader-text {
            color: var(--color-text);
        }
        :root[data-theme="light"] .loader-animation:before,
        :root[data-theme="light"] .loader-animation:after {
            box-shadow: 0 0 0 3px inset var(--color-text);
        }

        :root[data-theme="light"] .panel-title {
            color: var(--color-app-primary);
        }

        :root[data-theme="light"] .glass-panel {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-app-dark-light) 95%, transparent), color-mix(in srgb, var(--color-app-dark) 98%, transparent));
            border-left-color: color-mix(in srgb, var(--color-border) 5%, transparent);
        }

        :root[data-theme="light"] .feature-card:hover {
            border-color: color-mix(in srgb, var(--color-app-primary) 40%, transparent);
            box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--color-app-primary) 20%, transparent);
        }

        :root[data-theme="light"] .feature-card.active {
            border-color: var(--color-app-primary);
            background: color-mix(in srgb, var(--color-border) 5%, transparent);
            box-shadow: 0 0 15px color-mix(in srgb, var(--color-app-primary) 10%, transparent);
        }

        :root[data-theme="light"] .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--color-app-dark-lighter);
        }

        :root[data-theme="light"] .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--color-app-primary);
        }
    </style>
