        .loader { background: #0F172A; transition: opacity 0.1s ease, visibility 0.1s ease; }

        /* Light-mode overrides for this file's own hand-authored bootstrap CSS.

            background-color: var(--color-sm-dark);

        }

            color: var(--color-sm-primary);
        }

        :root[data-theme="light"] .glass-panel {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-sm-dark-light) 95%, transparent), color-mix(in srgb, var(--color-sm-dark) 98%, transparent));
            border-left-color: color-mix(in srgb, var(--color-border) 8%, transparent);
        }

        :root[data-theme="light"] .feature-card {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-border) 5%, transparent), color-mix(in srgb, var(--color-border) 1%, transparent));
            border-color: color-mix(in srgb, var(--color-border) 10%, transparent);
        }

        :root[data-theme="light"] .feature-card:hover {
            border-color: color-mix(in srgb, var(--color-sm-primary) 40%, transparent);
            box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--color-sm-primary) 20%, transparent);
        }

        :root[data-theme="light"] .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--color-sm-dark-lighter);
        }

        :root[data-theme="light"] .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--color-sm-primary);
