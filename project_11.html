<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台北醫學大學 | 臨床教育學習護照 - Case Study</title>
  <link rel="shortcut icon" type="image/ico" href="/img/favicon/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <script defer src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            color: #fff;
            overscroll-behavior: none;
        }

        .hero-bg-custom {
            background-image: url('./img/project_11/hero_img.jpg');
            background-image: -webkit-image-set(url('./img/project_11/hero_img.webp') 1x, url('./img/project_11/hero_img.jpg') 1x);
            background-image: image-set(url('./img/project_11/hero_img.webp') 1x, url('./img/project_11/hero_img.jpg') 1x);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-bg-custom::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(18, 18, 18, 0.8) 0%, rgba(18, 18, 18, 0.4) 45%, rgba(18, 18, 18, 0) 75%),
                linear-gradient(to bottom, rgba(18, 18, 18, 0.3) 0%, rgba(18, 18, 18, 0.8) 100%);
            z-index: 1;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.95), rgba(18, 18, 18, 0.98));
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: rgba(43, 108, 176, 0.4);
            box-shadow: 0 10px 30px -10px rgba(43, 108, 176, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #2B6CB0;
        }

        .scrollable-area {
            overflow-y: auto !important;
            overscroll-behavior: contain;
        }

        .horizontal-tabs {
            overflow-x: auto !important;
            overflow-y: hidden !important;
            touch-action: pan-x !important;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .horizontal-tabs::-webkit-scrollbar {
            display: none;
        }

        .loader { background: #121212; transition: opacity 0.1s ease, visibility 0.1s ease; }
    </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/projects/project_11.jsx"></script>
</body>
</html>
