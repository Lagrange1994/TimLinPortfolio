            position: relative;
        }

            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 17, 21, 0.2) 0%, rgba(15, 17, 21, 0.5) 100%);
            z-index: 1;

        /* Light-mode overrides for this file's own hand-authored bootstrap CSS.
           hero-bg-custom/::before and .loader deliberately excluded — fixed
           photo + vignette, same reasoning as the always-white hero text. */
        html[data-theme="light"],
        html[data-theme="light"] body {
            background-color: var(--color-lv-dark);
            color: var(--color-text);
        }

        :root[data-theme="light"] .panel-title {
            color: var(--color-lv-primary);
        }

        :root[data-theme="light"] .glass-panel {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-lv-dark-light) 95%, transparent), color-mix(in srgb, var(--color-lv-dark) 98%, transparent));
            border-left-color: color-mix(in srgb, var(--color-border) 8%, transparent);
        }

        :root[data-theme="light"] .feature-card {
            background: linear-gradient(135deg, color-mix(in srgb, var(--color-border) 5%, transparent), color-mix(in srgb, var(--color-border) 1%, transparent));
            border-color: color-mix(in srgb, var(--color-border) 10%, transparent);
        }

        :root[data-theme="light"] .feature-card:hover {
            border-color: color-mix(in srgb, var(--color-lv-primary) 40%, transparent);
            box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--color-lv-primary) 20%, transparent);
        }

        :root[data-theme="light"] .feature-card.active {
            border-color: color-mix(in srgb, var(--color-lv-primary) 80%, transparent);
